services:
  postgres:
    image: postgres:16
    container_name: farmlink-postgres
    environment:
      POSTGRES_DB: farmlink
      POSTGRES_USER: farmlink
      POSTGRES_PASSWORD: farmlink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: farmlink-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: farmlink-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: farmlink
      RABBITMQ_DEFAULT_PASS: farmlink

volumes:
  pgdata:
  mongodata: