name: CI

on:
  push:
    branches: [main, feature/github-actions-ci]
  pull_request:

jobs:
  backend-unit-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B test

  backend-integration-tests:
    name: Backend integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_PASSWORD: farmlink
      RABBITMQ_PASSWORD: farmlink
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: farmlink
          POSTGRES_USER: farmlink
          POSTGRES_PASSWORD: farmlink
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farmlink -d farmlink"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: farmlink
          RABBITMQ_DEFAULT_PASS: farmlink
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run integration tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B test -Dfarmlink.integration=true

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build production bundle
        run: npm run build
