server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/farmlink
    username: farmlink
    password: ${DATABASE_PASSWORD:farmlink}
  jpa:
    hibernate:
      ddl-auto: update

    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  data:
    mongodb:
      uri: mongodb://localhost:27017/farmlink
  rabbitmq:
    host: localhost
    port: 5672
    username: farmlink
    password: ${RABBITMQ_PASSWORD:farmlink}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google

farmlink:
  frontend-url: ${FARMLINK_FRONTEND_URL:http://localhost:5173}
  farmer-emails: ${FARMER_EMAILS:}
  admin-emails: ${ADMIN_EMAILS:}
